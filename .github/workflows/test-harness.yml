name: Test Harness

# Runs the AYS3 differential-testing tooling. See TESTING.md.
#
# Today: only tracediff.py's own unit tests (no real RPCS3/AYS3 traces yet,
# no vendored RPCS3 fork — that lands in Plan Phase 1). Kept on a native
# macOS arm64 runner on purpose: that's the same architecture family as the
# eventual reference (RPCS3 desktop arm64 build) and candidate (AYS3 core)
# builds, so this workflow only grows in place instead of being rewritten.

on:
  push:
    paths:
      - "tools/testharness/**"
      - ".github/workflows/test-harness.yml"
  pull_request:
    paths:
      - "tools/testharness/**"
      - ".github/workflows/test-harness.yml"
  workflow_dispatch: {}

jobs:
  tracediff-selftest:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Run tracediff unit tests
        run: python3 -m unittest discover -s tools/testharness/tests -v

